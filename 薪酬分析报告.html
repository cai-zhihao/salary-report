function formatMoney(val) {
    return Number(val).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.getElementById(tab + '-tab').classList.add('active');
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    if (tab === 'main') {
        document.querySelectorAll('.category-btn[data-tab="main"]').forEach(btn => {
            if (btn.dataset.category === currentCategory) {
                btn.classList.add('active');
            }
        });
    } else {
        document.querySelector('.category-btn.alert-btn').classList.add('active');
    }
}

function renderKPI(data) {
    const container = document.getElementById('kpiContainer');
    const hasData = data.total_headcount > 0;
    if (!hasData) {
        container.innerHTML = `
            <div class="kpi-card" style="grid-column: 1 / -1; text-align:center; border-left-color: #9ca3af;">
                <div class="value" style="font-size:18px;">📭 该类别暂无数据</div>
                <div class="sub">请切换其他类别查看</div>
            </div>
        `;
        return;
    }
    const totalCost = data.total_cost;
    const totalSalary = data.total_salary;
    const totalSs = data.total_ss;
    const totalHeadcount = data.total_headcount;
    const travelAllowance = data.travel_allowance || 0;
    const ratio1 = totalCost > 0 ? ((totalSalary / totalCost) * 100).toFixed(1) : '0.0';
    const ratio2 = totalCost > 0 ? ((totalSs / totalCost) * 100).toFixed(1) : '0.0';
    container.innerHTML = `
        <div class="kpi-card">
            <div class="label">📊 总用工成本</div>
            <div class="value">¥${formatMoney(totalCost)}</div>
            <div class="sub">${totalHeadcount} 人 ｜ 人均 ¥${formatMoney(totalCost / totalHeadcount)}</div>

        </div>
        <div class="kpi-card ss">
            <div class="label">🏦 社保公积金总成本</div>
            <div class="value">¥${formatMoney(totalSs)}</div>

            <div class="label">✈️ 出差补贴总额</div>

}

function renderTable(data) {
    const container = document.getElementById('tableContainer');
    if (!data.table_data || data.table_data.length === 0) {
        container.innerHTML = `<div class="no-data">暂无数据</div>`;
        return;
    }
    let html = `<table><thead><tr>
        <th>部门</th>
        <th>税前工资</th>
        <th>社保公积金</th>
        <th>总用工成本</th>
        <th>人数</th>
        <th>人均税前工资</th>
        <th>人均社保公积金</th>
        <th>同比变动 (额/%)</th>
    </tr></thead><tbody>`;
    data.table_data.forEach(row => {
        const yoyAmt = row['同比变动额'];
        const yoyPct = row['同比变动%'];
        const isRed = Math.abs(yoyPct) > THRESHOLD;
        const yoyDisplay = `${yoyAmt.toLocaleString()} (${yoyPct.toFixed(1)}%)`;
        html += `<tr>
            <td><strong>${row['分组']}</strong></td>
            <td>${formatMoney(row['税前工资'])}</td>
            <td>${formatMoney(row['社保公积金'])}</td>
            <td>${formatMoney(row['总用工成本'])}</td>
            <td>${row['人数']}</td>
            <td>${formatMoney(row['人均税前工资'])}</td>
            <td>${formatMoney(row['人均社保公积金'])}</td>
            <td class="${isRed ? 'highlight-red' : ''}">${yoyDisplay}</td>
        </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
}

// ========== 修改后的异常表格渲染（只显示部门，按部门排序） ==========
function renderAnomalyTable(containerId, anomalies) {
    const container = document.getElementById(containerId);
    if (!anomalies || anomalies.length === 0) {
        container.innerHTML = `<div class="no-data">✅ 无异常</div>`;
        return;
    }
    // 按部门名称排序
    const sorted = [...anomalies].sort((a, b) => a['分组'].localeCompare(b['分组']));
    let html = `<table><thead><tr>
        <th>部门</th>
        <th>异常项目</th>
        <th>变动率</th>
        <th>变动额</th>
        <th>当前值 → 对比值</th>
    </tr></thead><tbody>`;
    sorted.forEach(item => {
        const color = item['变动%'] > 0 ? '#d32f2f' : '#2e7d32';
        html += `<tr>
            <td><strong>${item['分组']}</strong></td>
            <td>${item['项目']}</td>
            <td style="color:${color};">${item['变动%'].toFixed(1)}%</td>
            <td>${item['变动额'].toLocaleString()}</td>
            <td>${item['当前值'].toLocaleString()} → ${item['对比值'].toLocaleString()}</td>
        </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
}

                backgroundColor: TOOLTIP_BG,
                borderColor: TOOLTIP_BORDER,
                borderWidth: 1,
                textStyle: { color: TOOLTIP_TEXT, fontSize: 12, fontFamily: '"Microsoft YaHei", sans-serif' },
                formatter: function(params) {
                    if (!params || params.length === 0) return '';
                    var idx = params[0].dataIndex;
                    var month = DATA.months[idx] || '';
                    var html = '<div style="font-weight:600;margin-bottom:6px;">' + month + '</div>';
                    var items = [
                        { label: '税前工资', value: DATA.salary_data[idx], color: COLORS.blue },
                        { label: '社保公积金', value: DATA.ss_data[idx], color: COLORS.purple },
                        { label: '总用工成本', value: DATA.cost_data[idx], color: COLORS.green },
                    ];
                    items.forEach(function(item) {
                        html += '<div style="display:flex;justify-content:space-between;gap:20px;padding:2px 0;">' +
                            '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + item.color + ';margin-right:6px;"></span>' + item.label + '</span>' +
                            '<span style="font-weight:600;font-variant-numeric:tabular-nums;">' + item.value.toFixed(1) + '</span>' +
                        '</div>';
                    });
                    return html;
                }
            },
            legend: {
                data: ['税前工资', '社保公积金', '总用工成本'],
                textStyle: { color: '#6b7280', fontSize: 12 },
                bottom: 0,
                icon: 'roundRect',
                itemWidth: 16,
                itemHeight: 4,
            },
            grid: { left: 80, right: 30, top: 20, bottom: 50 },
            xAxis: {
                type: 'category',
                data: DATA.months,
                axisLine: { lineStyle: { color: '#e5e7eb' } },
                axisLabel: { color: '#6b7280', fontSize: 11 },
                splitLine: { show: false },
            },
            yAxis: {
                type: 'value',
                axisLine: { show: false },
                axisLabel: { color: '#6b7280', fontSize: 11, fontFamily: '"JetBrains Mono", monospace' },
                splitLine: { lineStyle: { color: '#f0f2f5', type: 'dashed' } },
                scale: true,
            },
            series: [
                {
                    name: '税前工资',
                    type: 'line',
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: 8,
                    color: COLORS.blue,
                    areaStyle: { color: createAreaGradient(COLORS.blue) },
                    data: DATA.salary_data,
                    emphasis: { focus: 'series' },
                },
                {
                    name: '社保公积金',
                    type: 'line',
                    smooth: true,
                    symbol: 'diamond',
                    symbolSize: 8,
                    color: COLORS.purple,
                    areaStyle: { color: createAreaGradient(COLORS.purple) },
                    data: DATA.ss_data,
                    emphasis: { focus: 'series' },
                },
                {
                    name: '总用工成本',
                    type: 'line',
                    smooth: true,
                    symbol: 'square',
                    symbolSize: 8,
                    color: COLORS.green,
                    areaStyle: { color: createAreaGradient(COLORS.green) },
                    data: DATA.cost_data,
                    emphasis: { focus: 'series' },
                }
            ]
        };
        trendChart.setOption(optionTrend, true);
        trendChart.resize();
        if (!trendChart._listenerAdded) {
            trendChart.on('legendselectchanged', function(params) {
                var seriesIndex = [];
                var selected = params.selected;
                var names = ['税前工资', '社保公积金', '总用工成本'];
                for (var i = 0; i < names.length; i++) {
                    if (selected[names[i]]) seriesIndex.push(i);
                }
                trendChart.dispatchAction({ type: 'highlight', seriesIndex: seriesIndex });
            });
            trendChart._listenerAdded = true;
        }
    }

    // ---- 环形图 ----
    var pieDom = document.getElementById('chart-pie');
    if (pieDom) {
        var pieChart = echarts.getInstanceByDom(pieDom);
        if (!pieChart) {
            pieChart = echarts.init(pieDom, 'light');
        }
        var pieData = DATA.pie_data || [];
        var hasPieData = pieData.length > 0 && pieData[0].value > 0;
        var optionPie;
        if (!hasPieData) {
            optionPie = {
                title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#9ca3af', fontSize: 16, fontWeight: 400 } },
                series: []
            };
        } else {
            var colorPalette = ['#38bdf8', '#34d399', '#9B51E0', '#ff7a45', '#fbbf24', '#f472b6', '#60a5fa', '#a78bfa', '#f59e0b', '#6ee7b7', '#f87171', '#93c5fd'];
            var coloredData = pieData.map(function(item, idx) {
                return {
                    value: item.value,
                    name: item.name,
                    itemStyle: { color: colorPalette[idx % colorPalette.length] }
                };
            });
            var total = DATA.total_cost || 0;
            var totalWan = total / 10000;
            optionPie = {
                tooltip: {
                    trigger: 'item',
                    backgroundColor: TOOLTIP_BG,
                    borderColor: TOOLTIP_BORDER,
                    borderWidth: 1,
                    textStyle: { color: TOOLTIP_TEXT, fontSize: 12 },
                    formatter: function(params) {
                        return '<b>' + params.name + '</b><br>金额：<b>' + params.value.toFixed(2) + '</b> 万元<br>占比：<b>' + params.percent + '%</b>';
                    }
                },
                legend: {
                    orient: 'vertical',
                    right: 10,
                    top: 'center',
                    textStyle: { color: '#6b7280', fontSize: 12 },
                    itemWidth: 12,
                    itemHeight: 12,
                },
                series: [{
                    type: 'pie',
                    radius: ['42%', '70%'],
                    avoidLabelOverlap: true,
                    padAngle: 2,
                    itemStyle: {
                        borderRadius: 6,
                        borderColor: '#ffffff',
                        borderWidth: 2,
                    },
                    label: { show: false },
                    emphasis: {
                        label: { show: true, fontSize: 14, fontWeight: 'bold', color: '#1a1a2e' },
                        scale: true,
                        scaleSize: 6,
                    },
                    data: coloredData,
                }],
                graphic: [{
                    type: 'text',
                    left: 'center',
                    top: 'center',
                    style: {
                        text: totalWan.toFixed(2) + '\n万元',
                        textAlign: 'center',
                        textVerticalAlign: 'middle',
                        fontSize: 18,
                        fontWeight: 700,
                        color: '#1a1a2e',
                        lineHeight: 28,
                    },
                    z: 100,
                }],
            };
        }
        pieChart.setOption(optionPie, true);
        pieChart.resize();
    }

    // ---- 部门人均税前工资柱状图 ----
    var barDom = document.getElementById('chart-bar');
    if (barDom) {
        var barChart = echarts.getInstanceByDom(barDom);
        if (!barChart) {
            barChart = echarts.init(barDom, 'light');
        }
        var optionBar;
        if (!hasData || DATA.dept_names.length === 0) {
            optionBar = {
                title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#9ca3af', fontSize: 16, fontWeight: 400 } },
                xAxis: { show: false },
                yAxis: { show: false },
                series: []
            };
        } else {
            var names = DATA.dept_names.slice(0, 10);
            var values = DATA.dept_avg_salary.slice(0, 10);
            var colors = names.map(function(n) {
                return (n.includes('生产') || n.includes('营销')) ? COLORS.blue : COLORS.gray;
            });
            optionBar = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    backgroundColor: TOOLTIP_BG,
                    borderColor: TOOLTIP_BORDER,
                    borderWidth: 1,
                    textStyle: { color: TOOLTIP_TEXT, fontSize: 12 },
                    formatter: function(params) {
                        if (!params || params.length === 0) return '';
                        var p = params[0];
                        return '<b>' + p.name + '</b><br>人均税前工资：<b>' + p.value.toFixed(2) + '</b> 万元';
                    }
                },
                grid: { left: 140, right: 50, top: 20, bottom: 20 },
                xAxis: {
                    type: 'value',
                    name: '万元',
                    nameTextStyle: { color: '#6b7280', fontSize: 11 },
                    axisLine: { show: false },
                    axisLabel: { color: '#6b7280', fontSize: 11, fontFamily: '"JetBrains Mono", monospace' },
                    splitLine: { lineStyle: { color: '#f0f2f5', type: 'dashed' } },
                },
                yAxis: {
                    type: 'category',
                    data: names,
                    axisLine: { show: false },
                    axisTick: { show: false },
                    axisLabel: {
                        color: '#6b7280',
                        fontSize: 11,
                        interval: 0,
                        width: 90,
                        overflow: 'break'
                    },
                },
                series: [{
                    type: 'bar',
                    data: values.map(function(v, i) {
                        return {
                            value: v,
                            itemStyle: {
                                color: colors[i],
                                borderRadius: [0, 4, 4, 0],
                            }
                        };
                    }),
                    barWidth: 12,
                    label: {
                        show: true,
                        position: 'right',
                        formatter: function(p) { return p.value.toFixed(2) + '万'; },
                        color: '#6b7280',
                        fontSize: 10,
                        fontFamily: '"JetBrains Mono", monospace',
                    },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowColor: 'rgba(56, 189, 248, 0.3)',
                        }
                    }
                }]
            };
        }
        barChart.setOption(optionBar, true);
        barChart.resize();
    }

    // ---- 同比柱状图 ----
    var yoyDom = document.getElementById('chart-yoy');
    if (yoyDom) {
        var yoyChart = echarts.getInstanceByDom(yoyDom);
        if (!yoyChart) {
            yoyChart = echarts.init(yoyDom, 'light');
        }
        var optionYoy;
        if (!hasData || DATA.yoy_names.length === 0) {
            optionYoy = {
                title: { text: '暂无数据', left: 'center', top: 'center', textStyle: { color: '#9ca3af', fontSize: 16, fontWeight: 400 } },
                xAxis: { show: false },
                yAxis: { show: false },
                series: []
            };
        } else {
            var yoyNames = DATA.yoy_names;
            var yoyValues = DATA.yoy_values;
            var colors = yoyValues.map(function(v) { return v > 0 ? COLORS.red : COLORS.darkGreen; });
            optionYoy = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'shadow' },
                    backgroundColor: TOOLTIP_BG,
                    borderColor: TOOLTIP_BORDER,
                    borderWidth: 1,
                    textStyle: { color: TOOLTIP_TEXT, fontSize: 12 },
                    formatter: function(params) {
                        if (!params || params.length === 0) return '';
                        var p = params[0];
                        var idx = p.dataIndex;
                        var pct = (DATA.yoy_pcts[idx] || 0);
                        var status = Math.abs(pct) > THRESHOLD ? '⚠️ 需关注' : '✅ 正常';
                        return '<b>' + p.name + '</b><br>' +
                               '同比变动：<b>' + p.value.toFixed(1) + '</b> 万元<br>' +
                               '同比变动%：<b>' + pct.toFixed(1) + '%</b><br>' +
                               '<span style="color:#8b9aae;font-size:11px;">' + status + '</span>';
                    }
                },
                grid: {
                    left: 200,
                    right: 100,
                    top: 20,
                    bottom: 20,
                },
                xAxis: {
                    type: 'value',
                    axisLine: { show: false },
                    axisLabel: { color: '#6b7280', fontSize: 11, fontFamily: '"JetBrains Mono", monospace' },
                    splitLine: { lineStyle: { color: '#f0f2f5', type: 'dashed' } },
                },
                yAxis: {
                    type: 'category',
                    data: yoyNames,
                    axisLine: { show: false },
                    axisTick: { show: false },
                    axisLabel: {
                        color: '#6b7280',
                        fontSize: 11,
                        interval: 0,
                    },
                },
                series: [{
                    type: 'bar',
                    data: yoyValues.map(function(v, i) {
                        return {
                            value: v,
                            itemStyle: {
                                color: colors[i],
                                borderRadius: v > 0 ? [0, 4, 4, 0] : [4, 0, 0, 4],
                            }
                        };
                    }),
                    barWidth: 10,
                    label: {
                        show: true,
                        position: function(p) { return p.value > 0 ? 'right' : 'left'; },
                        distance: 8,
                        formatter: function(p) { return p.value.toFixed(1) + '万'; },
                        color: 'rgba(255,255,255,0.85)',
                        fontSize: 11,
                        fontWeight: 'normal',
                        fontFamily: '"JetBrains Mono", monospace',
                        textShadowBlur: 4,
                        textShadowColor: 'rgba(0,0,0,0.5)',
                    },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowColor: 'rgba(255, 122, 69, 0.3)',
                        }
                    }
                }]
            };
        }
        yoyChart.setOption(optionYoy, true);
        yoyChart.resize();
    }
}

function switchCategory(category) {
    if (category === currentCategory) {
        switchTab('main');
        return;
    }
    currentCategory = category;
    DATA = CATEGORY_DATA[category];
    switchTab('main');
    document.querySelectorAll('.category-btn[data-tab="main"]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.category === category);
    });
    renderKPI(DATA);
    renderTable(DATA);
    chartRetryCount = 0;
    renderCharts();
}

document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.category-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const tab = this.dataset.tab;
            if (tab === 'alert') {
                switchTab('alert');
                updateAlertTab();
                return;
            }
            const cat = this.dataset.category;
            if (cat) {
                switchCategory(cat);
            }
        });
    });

    renderKPI(DATA);
    renderTable(DATA);
    updateAlertTab();
    setTimeout(function() {
        renderCharts();
    }, 400);
});

window.addEventListener('load', function() {
    setTimeout(function() {
        renderCharts();
    }, 300);
});
</script>
</body>
</html>
