<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的第一个飞书插件</title>
    <style>
        /* 简单加点样式，让页面好看一点 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f6fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            color: #1d2129;
            margin-bottom: 8px;
        }
        p {
            font-size: 16px;
            color: #4e5969;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            margin-top: 20px;
            background: #e8f3ff;
            color: #0442d2;  /* 飞书主题色 */
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚀</div>
        <h1>Hello World!</h1>
        <p>插件部署成功！🎉</p>
        <span class="badge">✅ 飞书多维表格 · 边栏插件</span>
    </div>
</body>
</html>
