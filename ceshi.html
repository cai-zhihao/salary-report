<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>公司主体管理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f6fa;
            padding: 24px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 32px 28px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }
        h1 {
            font-size: 20px;
            color: #1d2129;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 14px;
            color: #86909c;
            margin-bottom: 20px;
        }
        .config-hint {
            background: #f7f8fa;
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 12px;
            color: #4e5969;
            line-height: 1.8;
            margin-bottom: 20px;
            font-family: monospace;
            word-break: break-all;
        }
        .config-hint .label {
            color: #86909c;
        }
        .config-hint .value {
            color: #0442d2;
            font-weight: 600;
        }
        .btn {
            width: 100%;
            padding: 12px 0;
            background: #0442d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #0336b0;
        }
        .btn:disabled {
            background: #c9cdd4;
            cursor: not-allowed;
        }
        .log-area {
            margin-top: 20px;
            background: #f7f8fa;
            border-radius: 8px;
            padding: 16px;
            max-height: 340px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.8;
            color: #1d2129;
            font-family: "SF Mono", "Menlo", monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-area .success {
            color: #00a854;
        }
        .log-area .error {
            color: #f53f3f;
        }
        .log-area .info {
            color: #4e5969;
        }
        .log-area .warn {
            color: #f7b731;
        }
        .status-bar {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #86909c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📋 公司主体管理</h1>
        <p class="subtitle">基于 OpenAPI 直调 · 自动获取 Token</p>

        <div class="config-hint">
            <div><span class="label">App ID:</span> <span class="value">cli_aa0fb37e35795bcb</span></div>
            <div><span class="label">App Secret:</span> <span class="value">✅ 已配置</span></div>
            <div><span class="label">app_token:</span> <span class="value">Mj4cbLnCIaTNp5sdKgdcQVDknWh</span></div>
            <div><span class="label">table_id:</span> <span class="value">tbllHH6xdkiBYBZF</span></div>
            <div><span class="label">目标列名:</span> <span class="value">公司主体名称</span></div>
        </div>

        <button class="btn" id="executeBtn">🚀 执行全部操作</button>

        <div class="log-area" id="logArea">⏳ 就绪，点击按钮开始...</div>
        <div class="status-bar">
            <span id="statusText">就绪</span>
            <span id="recordCount"></span>
        </div>
    </div>

    <script>
        // ================================================================
        // ⚙️ 全部配置已就绪，无需修改
        // ================================================================

        const CONFIG = {
            APP_ID: 'cli_aa0fb37e35795bcb',
            APP_SECRET: 'EvON0FQhBDNPBcDhD3fh9eQXrFva7ltk',
            APP_TOKEN: 'Mj4cbLnCIaTNp5sdKgdcQVDknWh',
            TABLE_ID: 'tbllHH6xdkiBYBZF',
            COLUMN_NAME: '公司主体名称',
            DELETE_VALUE: '自然造物（安徽）酒业有限公司',
            UPDATE_FROM: '元气森林（合肥）食品科技有限公司',
            UPDATE_TO: '测试',
            NEW_VALUE: '测试2',
        };

        // ================================================================
        // 主逻辑
        // ================================================================

        const logArea = document.getElementById('logArea');
        const statusText = document.getElementById('statusText');
        const recordCount = document.getElementById('recordCount');
        const executeBtn = document.getElementById('executeBtn');

        function log(message, type = 'info') {
            const line = document.createElement('div');
            line.className = type;
            line.textContent = message;
            logArea.appendChild(line);
            logArea.scrollTop = logArea.scrollHeight;
        }

        function clearLog() {
            logArea.innerHTML = '';
        }

        function setStatus(text) {
            statusText.textContent = text;
        }

        // ---- 获取 tenant_access_token ----
        async function getTenantAccessToken() {
            const response = await fetch('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json; charset=utf-8',
                },
                body: JSON.stringify({
                    app_id: CONFIG.APP_ID,
                    app_secret: CONFIG.APP_SECRET,
                }),
            });

            const result = await response.json();

            if (result.code !== 0) {
                throw new Error(`获取 token 失败 (${result.code}): ${result.msg}`);
            }

            return result.tenant_access_token;
        }

        // ---- 封装飞书 OpenAPI 调用 ----
        async function callFeishuAPI(method, endpoint, body = null, token) {
            const url =
                `https://open.feishu.cn/open-apis/bitable/v1/apps/${CONFIG.APP_TOKEN}/tables/${CONFIG.TABLE_ID}${endpoint}`;

            const options = {
                method: method,
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json; charset=utf-8',
                },
            };

            if (body) {
                options.body = JSON.stringify(body);
            }

            const response = await fetch(url, options);
            const result = await response.json();

            if (result.code !== 0) {
                throw new Error(`API 错误 (${result.code}): ${result.msg || JSON.stringify(result)}`);
            }

            return result.data;
        }

        // ---- 获取所有记录 ----
        async function getAllRecords(token) {
            const data = await callFeishuAPI('GET', '/records?page_size=100', null, token);
            return data.items || [];
        }

        // ---- 删除记录 ----
        async function deleteRecord(recordId, token) {
            await callFeishuAPI('DELETE', `/records/${recordId}`, null, token);
        }

        // ---- 更新记录 ----
        async function updateRecord(recordId, fields, token) {
            await callFeishuAPI('PUT', `/records/${recordId}`, { fields }, token);
        }

        // ---- 新增记录 ----
        async function addRecord(fields, token) {
            await callFeishuAPI('POST', '/records', { fields }, token);
        }

        // ---- 主执行函数 ----
        async function executeAll() {
            executeBtn.disabled = true;
            executeBtn.textContent = '⏳ 获取 Token...';
            clearLog();
            setStatus('获取 Token 中...');
            log('🔑 正在获取 tenant_access_token...', 'info');

            let token = null;

            try {
                // ---- 第0步：获取 token ----
                token = await getTenantAccessToken();
                log('✅ 获取 token 成功！(有效期 2 小时)', 'success');
                setStatus('Token 已获取，执行中...');
                executeBtn.textContent = '⏳ 执行中...';

                // ---- 第1步：获取所有记录 ----
                log('📊 正在获取所有记录...', 'info');
                const records = await getAllRecords(token);
                log(`✅ 获取到 ${records.length} 条记录`, 'success');
                recordCount.textContent = `共 ${records.length} 条`;

                // ---- 第2步：找出目标记录 ----
                let deleteRecordId = null;
                let updateRecordId = null;

                for (const record of records) {
                    const fields = record.fields || {};
                    let value = fields[CONFIG.COLUMN_NAME];

                    if (Array.isArray(value)) {
                        value = value.join('');
                    } else {
                        value = String(value || '');
                    }

                    if (value === CONFIG.DELETE_VALUE) {
                        deleteRecordId = record.record_id;
                    }
                    if (value === CONFIG.UPDATE_FROM) {
                        updateRecordId = record.record_id;
                    }
                }

                // ---- 第3步：执行删除 ----
                if (deleteRecordId) {
                    log(`🗑️ 找到要删除的行: "${CONFIG.DELETE_VALUE}" (ID: ${deleteRecordId})`, 'info');
                    await deleteRecord(deleteRecordId, token);
                    log(`✅ 已删除 "${CONFIG.DELETE_VALUE}"`, 'success');
                } else {
                    log(`⚠️ 未找到要删除的值: "${CONFIG.DELETE_VALUE}"`, 'warn');
                }

                // ---- 第4步：执行修改 ----
                if (updateRecordId) {
                    try {
                        log(`✏️ 找到要修改的行: "${CONFIG.UPDATE_FROM}" → "${CONFIG.UPDATE_TO}" (ID: ${updateRecordId})`,
                            'info');
                        await updateRecord(updateRecordId, {
                            [CONFIG.COLUMN_NAME]: CONFIG.UPDATE_TO
                        }, token);
                        log(`✅ 已修改为 "${CONFIG.UPDATE_TO}"`, 'success');
                    } catch (err) {
                        if (err.message.includes('404') || err.message.includes('记录不存在')) {
                            log(`⚠️ 要修改的记录 "${CONFIG.UPDATE_FROM}" 已被删除，跳过修改`, 'warn');
                        } else {
                            throw err;
                        }
                    }
                } else {
                    log(`⚠️ 未找到要修改的值: "${CONFIG.UPDATE_FROM}"`, 'warn');
                }

                // ---- 第5步：执行新增 ----
                log(`➕ 正在新增记录: "${CONFIG.NEW_VALUE}"...`, 'info');
                await addRecord({
                    [CONFIG.COLUMN_NAME]: CONFIG.NEW_VALUE
                }, token);
                log(`✅ 已新增一行: "${CONFIG.NEW_VALUE}"`, 'success');

                // ---- 第6步：完成 ----
                const finalRecords = await getAllRecords(token);
                recordCount.textContent = `共 ${finalRecords.length} 条`;
                log(`🎉 全部操作完成！当前表格共 ${finalRecords.length} 条记录`, 'success');
                setStatus('✅ 执行完成');

            } catch (error) {
                log(`❌ 错误: ${error.message}`, 'error');
                console.error(error);
                setStatus('❌ 执行失败');

                if (error.message.includes('403') || error.message.includes('permission') ||
                    error.message.includes('权限')) {
                    log('💡 提示: 请在飞书开发者后台为应用开通 bitable:app 权限，并创建版本发布', 'info');
                }
                if (error.message.includes('400')) {
                    log('💡 提示: 请检查 app_token 和 table_id 是否正确', 'info');
                }
            } finally {
                executeBtn.disabled = false;
                executeBtn.textContent = '🚀 执行全部操作';
            }
        }

        // ---- 绑定按钮 ----
        executeBtn.addEventListener('click', executeAll);
    </script>

</body>
</html>
